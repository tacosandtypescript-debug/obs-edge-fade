name: Build plugin
description: Configure, build and install the Windows x64 plugin artifact.

inputs:
  config:
    description: CMake build configuration
    required: false
    default: RelWithDebInfo
  installPrefix:
    description: Install prefix, relative to the workspace
    required: false
    default: release

runs:
  using: composite
  steps:
    - name: Configure
      shell: pwsh
      run: cmake --preset windows-ci-x64

    - name: Build
      shell: pwsh
      run: cmake --build --preset windows-x64 --config ${{ inputs.config }} --parallel

    - name: Install
      shell: pwsh
      run: cmake --install build_x64 --config ${{ inputs.config }} --prefix "${{ github.workspace }}/${{ inputs.installPrefix }}"
