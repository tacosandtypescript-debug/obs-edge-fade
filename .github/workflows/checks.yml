name: Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format 19
        run: npm install --global @wasm-fmt/clang-format@19.1.0

      - name: Check formatting
        run: |
          CLI="$(npm root -g)/@wasm-fmt/clang-format/clang-format-cli.cjs"
          mapfile -t files < <(find src tests -type f \( -name '*.c' -o -name '*.h' \))
          node "$CLI" --dry-run --Werror --style=file:"$PWD/.clang-format" "${files[@]}"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tests/unit -B build_tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_tests --parallel

      - name: Test
        run: ctest --test-dir build_tests --output-on-failure
